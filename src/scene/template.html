<style>html,body{margin:0;height:100%;background:#0a0705;overflow:hidden}a{color:#e9d9bd}a:hover{color:#fff3dc}button{font:inherit}</style>
</helmet>
<div data-screen-label="Scene" style="position:fixed;inset:0;background:#0a0705;overflow:hidden;font-family:'DM Mono',ui-monospace,monospace;color:#efe3cc;">
  <div ref="{{ mountRef }}" style="position:absolute;inset:0;cursor:{{ cursor }};"></div>
  <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 46%, rgba(10,6,3,0) 58%, rgba(10,6,3,0.5) 100%);"></div>
  <div ref="{{ grainRef }}" style="position:absolute;inset:0;pointer-events:none;opacity:{{ grainOpacity }};mix-blend-mode:overlay;"></div>
  <div data-screen-label="Files" style="position:absolute;inset:0;opacity:{{ filesOpacity }};visibility:{{ filesVis }};pointer-events:{{ filesPE }};transition:opacity 520ms ease, visibility 0s linear {{ filesVisDelay }};">
    <sc-if value="{{ mountFiles }}">
    <dc-import name="DrawerFiles" on-back="{{ leaveFiles }}" active="{{ showFiles }}" open-file="{{ openFile }}" hint-size="100%,100%" style="position:absolute;inset:0;"></dc-import>
    </sc-if>
  </div>
  <div style="position:absolute;inset:0;pointer-events:none;background:#0a0705;opacity:{{ fade }};transition:opacity {{ fadeMs }}ms ease;"></div>

  <sc-if value="{{ showEnter }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;bottom:4vh;display:flex;justify-content:center;pointer-events:none;">
      <button onClick="{{ enter }}" style="pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:12px;background:none;border:0;padding:14px 22px;cursor:pointer;color:rgba(239,227,204,0.82);font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.34em;text-transform:uppercase;" style-hover="color:#fff6e4;">
        <span style="padding:10px 18px;background:rgba(20,12,6,0.55);border-radius:2px;backdrop-filter:blur(3px);color:#f6ecda;">Enter the room</span>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{ showSkip }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ skip }}" style="position:absolute;top:22px;right:26px;background:none;border:0;padding:10px 12px;cursor:pointer;color:rgba(239,227,204,0.5);font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;" style-hover="color:rgba(255,246,228,0.95);">Skip intro</button>
  </sc-if>

  <sc-if value="{{ showReturn }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ back }}" style="position:absolute;left:26px;bottom:24px;display:flex;align-items:center;gap:10px;background:rgba(20,12,6,0.18);border:0;border-radius:2px;padding:10px 14px;cursor:pointer;color:rgba(255,248,236,0.78);font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;backdrop-filter:blur(2px);" style-hover="color:#fffaf0;background:rgba(20,12,6,0.32);">
      <span style="display:block;width:18px;height:1px;background:currentColor;"></span>
      <span>{{ backLabel }}</span>
    </button>
  </sc-if>

  <div style="position:absolute;top:26px;right:28px;display:flex;justify-content:flex-end;pointer-events:none;opacity:{{ captionOpacity }};transition:opacity 400ms ease;">
    <span style="padding:8px 14px;background:rgba(20,12,6,0.22);border-radius:2px;color:rgba(255,248,236,0.9);font-size:10px;letter-spacing:0.32em;text-transform:uppercase;backdrop-filter:blur(2px);">{{ caption }}</span>
  </div>

  <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
      <span style="color:rgba(239,227,204,0.45);font-size:10px;letter-spacing:0.34em;text-transform:uppercase;">{{ msg }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;filmGrain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;introPace&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Brisk&quot;,&quot;Measured&quot;],&quot;default&quot;:&quot;Brisk&quot;,&quot;tsType&quot;:&quot;'Brisk' | 'Measured'&quot;},&quot;lightShafts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;ambientOcclusion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">/* __SCENE_LOGIC__ */</script>
</body>
